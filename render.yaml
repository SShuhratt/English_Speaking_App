services:
  # Web service for Laravel Octane (frankenphp)
  - type: web
    name: edtech-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: edtech-db
          property: connectionString
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_URL
        sync: false # Set this to your Upstash Redis connection string (e.g. rediss://...)
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: redis

databases:
  - name: edtech-db
    plan: free
